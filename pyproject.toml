[project]
name = "llm-lab"
version = "0.1.0"
description = "Learn by building a small language model from scratch"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "numpy>=2.5.2",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
    "torch",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Windows (Ronin) gets CUDA torch from the PyTorch index; every other
# platform keeps default PyPI. explicit=true hides this index from all
# other packages. Why: `uv run` reverts win32 torch to the PyPI CPU
# build on every launch (124MB vs 2.5GB cu126 wheel) -- this pin makes
# the CUDA build part of the lockfile instead of a manual reinstall.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
]

[tool.hatch.build.targets.wheel]
packages = ["model", "train", "inference", "harness", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
